<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <title>Pedidos | TheKiwiStore</title><link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f8f5;color:#1c2c21;font:15px/1.5 system-ui,sans-serif}.wrap{width:min(1080px,calc(100% - 32px));margin:36px auto}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}h1{font-size:1.7rem;margin:0}a{color:#176a3d}button{font:inherit;font-weight:700;padding:10px 14px;border:0;border-radius:9px;background:#147a43;color:white;cursor:pointer}button:disabled{opacity:.55;cursor:wait}input{font:inherit;width:100%;padding:12px;border:1px solid #cad8cc;border-radius:9px}.password-field{position:relative}.password-field input{padding-right:48px}.password-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:grid;place-items:center;padding:8px!important;background:transparent!important;color:#5e6e63!important}.password-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.panel,.order{background:white;border:1px solid #e1e9e2;border-radius:15px;padding:20px;margin:14px 0}.login{max-width:460px}.login form{display:grid;gap:12px}.muted{color:#5e6e63}.error{color:#a12d25;min-height:1.4em}.orders{display:grid;gap:14px}.order-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.order h2{font-size:1.05rem;margin:0}.badge{display:inline-block;padding:3px 9px;border-radius:999px;background:#edf4ee;font-size:.8rem;font-weight:700}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.details p{margin:0}.items{padding-left:20px}.address{white-space:pre-line}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}@media(max-width:600px){.details{grid-template-columns:1fr}.wrap{margin:20px auto}header{align-items:flex-start}}
  </style>
</head>
<body><main class="wrap"><header><div><h1>Pedidos</h1><p class="muted">Panel privado de TheKiwiStore</p></div><nav><a href="/admin/">Volver al panel</a> · <a href="/">Tienda</a></nav></header>
  <section class="panel login" id="login"><h2>Acceso del administrador</h2><p class="muted">Introduce el token configurado en Cloudflare. El token se mantiene solo mientras esta página esté abierta.</p><form id="login-form"><label for="token">Token de acceso</label><div class="password-field"><input id="token" type="password" autocomplete="current-password" required minlength="24"><button id="toggle-token" class="password-toggle" type="button" aria-label="Mostrar contraseña" title="Mostrar contraseña"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button id="login-button" type="submit">Ver pedidos</button></form><p class="error" id="login-error" role="alert"></p></section>
  <section id="results" hidden><div class="toolbar"><p class="muted" id="status"></p><button id="refresh" type="button">Actualizar</button></div><div class="orders" id="orders"></div></section>
</main>
<script>
  let adminToken='';
  const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(n||0)/100);
  const text=(tag,value,cls)=>{const node=document.createElement(tag);node.textContent=value??'';if(cls)node.className=cls;return node};
  async function loadOrders(){const button=document.getElementById('refresh');button.disabled=true;document.getElementById('status').textContent='Cargando…';try{const r=await fetch('/api/admin-orders',{headers:{'x-admin-token':adminToken,'cache-control':'no-store'}});const data=await r.json();if(!r.ok)throw new Error(data.error||'No se pudieron cargar los pedidos.');draw(data.orders||[]);document.getElementById('login').hidden=true;document.getElementById('results').hidden=false;document.getElementById('status').textContent=`${data.orders?.length||0} pedidos recientes.`}catch(e){document.getElementById('login').hidden=false;document.getElementById('results').hidden=true;document.getElementById('login-error').textContent=e.message;adminToken='';document.getElementById('token').value=''}finally{button.disabled=false}}
  function draw(orders){const root=document.getElementById('orders');root.replaceChildren();if(!orders.length){root.append(text('p','Todavía no hay pedidos.','muted'));return}for(const order of orders){const card=document.createElement('article');card.className='order';const head=document.createElement('div');head.className='order-head';const ref=order.id?String(order.id).slice(0,8):'Pedido';head.append(text('h2',`Pedido ${ref}`),text('span',order.status||'desconocido','badge'));card.append(head);const details=document.createElement('div');details.className='details';details.append(text('p',`Fecha: ${order.created_at?new Date(order.created_at).toLocaleString('es-ES'):'—'}`),text('p',`Total: ${money(order.total_cents)}`),text('p',`Cliente: ${order.customer_name||'—'}`),text('p',`Email: ${order.customer_email||'—'}`));const address=order.shipping?.address;const addressText=address?[order.shipping.name,address.line1,address.line2,[address.postal_code,address.city].filter(Boolean).join(' '),address.state,address.country].filter(Boolean).join('\n'):'No disponible';details.append(text('p',`Envío:\n${addressText}`,'address'));const list=document.createElement('ul');list.className='items';for(const item of order.items||[])list.append(text('li',`${item.quantity} × ${item.title} — ${money(item.lineTotal)}`));details.append(list);card.append(details);root.append(card)}}
  document.getElementById('toggle-token').addEventListener('click',()=>{const input=document.getElementById('token'),button=document.getElementById('toggle-token'),show=input.type==='password';input.type=show?'text':'password';button.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');button.setAttribute('title',show?'Ocultar contraseña':'Mostrar contraseña');input.focus()});document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();adminToken=document.getElementById('token').value;document.getElementById('login-error').textContent='';document.getElementById('login-button').disabled=true;await loadOrders();document.getElementById('login-button').disabled=false});
  document.getElementById('refresh').addEventListener('click',loadOrders);
</script></body></html>
