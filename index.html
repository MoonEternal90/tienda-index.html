<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Kiwi Store | Próximamente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* Truco CSS para fusionar el fondo negro del logo con el fondo de la web */
    .logo-blend {
      mix-blend-mode: screen;
    }
  </style>
</head>
<body class="bg-black text-slate-100 antialiased min-h-screen flex items-center justify-center p-4">

  <div class="max-w-4xl w-full text-center">
    
    <!-- CONTENEDOR DEL LOGO -->
    <div class="mb-8 flex justify-center items-center">
        <img 
            src="images/trasn.png" 
            alt="Logo The Kiwi Store" 
            class="h-auto w-64 md:w-80 object-contain logo-blend"
        >
    </div>
    
    <!-- MENSAJE DE MANTENIMIENTO -->
    <div class="max-w-2xl mx-auto bg-slate-900/80 backdrop-blur-lg rounded-3xl shadow-2xl p-8 border border-slate-800">
        <span class="inline-block px-4 py-1.5 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 mb-5 uppercase tracking-wider border border-emerald-500/20">
          🚀 Lanzamiento Inminente
        </span>
        
        <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-3 tracking-tight">
          Estamos puliendo los últimos detalles.
        </h1>
        
        <p class="text-slate-300 text-base md:text-lg mb-8 leading-relaxed">
          El superhéroe kiwi está preparando todo para que <strong>TheKiwiStore.com</strong> sea espectacular. ¡Vuelve a visitarnos muy pronto!
        </p>

        <div class="pt-6 border-t border-slate-800 text-sm text-slate-400">
          &copy; 2026 The Kiwi Store. Todos los derechos reservados.
        </div>
    </div>
  </div>

</body>
</html>
